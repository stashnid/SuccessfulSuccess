name: Deploy to AWS

# Deployment is manual until the repository's AWS OIDC role and targets are
# configured. A push must never deploy an older branch over the live lab app.
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
  AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
  S3_BUCKET: ${{ vars.S3_BUCKET }}
  CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
  IMAGE_TAG: latest
  ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
  ECS_SERVICE: ${{ vars.ECS_SERVICE }}

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Check deployment configuration
        run: |
          for name in AWS_REGION AWS_ACCOUNT_ID AWS_ROLE_ARN S3_BUCKET CLOUDFRONT_DISTRIBUTION_ID ECR_REPOSITORY ECS_CLUSTER ECS_SERVICE; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Set the repository variable $name before running this workflow."
              exit 1
            fi
          done

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy Backend to AWS ECS Fargate
        run: make deploy-backend

      - name: Deploy Frontend to AWS S3 & CloudFront
        run: make deploy-frontend
